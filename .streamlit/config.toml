# Native Streamlit theme for the "Polymer Intelligence Lab" design system.
# Widgets (inputs, sliders, tabs, alerts, dataframes, metrics) pick these up
# directly, so ui_theme.py only needs CSS for the custom HTML pieces.
# Keep in sync with ui_theme.TOKENS and frontend/src/lib/design-tokens.ts.

[theme]
base = "dark"
primaryColor = "#22D3EE"
backgroundColor = "#080B14"
secondaryBackgroundColor = "#111827"
textColor = "#F1F5F9"
linkColor = "#22D3EE"
borderColor = "#263449"
showWidgetBorder = true
dataframeBorderColor = "#263449"
dataframeHeaderBackgroundColor = "#151D2E"
codeBackgroundColor = "#0D1220"
baseRadius = "10px"
buttonRadius = "10px"

font = "Geist:https://fonts.googleapis.com/css2?family=Geist:wght@300..800&display=swap, sans-serif"
headingFont = "Geist, sans-serif"
codeFont = "Geist Mono:https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400..600&display=swap, monospace"

blueColor = "#22D3EE"
violetColor = "#8B5CF6"
yellowColor = "#FBBF24"
greenColor = "#34D399"
redColor = "#FB7185"

chartCategoricalColors = ["#22D3EE", "#A78BFA", "#FBBF24", "#34D399", "#FB7185"]
