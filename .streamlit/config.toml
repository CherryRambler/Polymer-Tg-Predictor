# Native Streamlit theme for the "Polymer Intelligence Lab" design system
# ("lab notebook": warm paper, navy-blue ink, signal orange). Widgets (inputs,
# sliders, alerts, dataframes, metrics) pick these up directly, so app.py only
# needs CSS for the custom HTML pieces. Keep in sync with TOKENS in app.py.

[theme]
base = "light"
primaryColor = "#1D4ED8"
backgroundColor = "#F6F5F1"
secondaryBackgroundColor = "#EFEDE6"
textColor = "#14213D"
linkColor = "#1D4ED8"
borderColor = "#DAD7CE"
showWidgetBorder = true
dataframeBorderColor = "#DAD7CE"
dataframeHeaderBackgroundColor = "#F9F8F5"
codeBackgroundColor = "#EFEDE6"
baseRadius = "10px"
buttonRadius = "10px"

font = "Geist:https://fonts.googleapis.com/css2?family=Geist:wght@300..800&display=swap, sans-serif"
headingFont = "Geist, sans-serif"
codeFont = "Geist Mono:https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400..600&display=swap, monospace"

blueColor = "#1D4ED8"
violetColor = "#6D28D9"
orangeColor = "#EA580C"
yellowColor = "#B45309"
greenColor = "#15803D"
redColor = "#B91C1C"

chartCategoricalColors = ["#1D4ED8", "#EA580C", "#15803D", "#DC2626", "#5B6475"]
